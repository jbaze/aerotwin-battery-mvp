<div class="max-w-2xl mx-auto p-6 bg-white rounded-lg shadow-sm border border-gray-200">
      <div class="mb-6">
        <h1 class="text-2xl font-bold text-gray-900 mb-2">{{ formTemplate.title }}</h1>
        <p class="text-gray-600" *ngIf="formTemplate.description">{{ formTemplate.description }}</p>
      </div>

      <form [formGroup]="dynamicForm" (ngSubmit)="onSubmit()" class="space-y-6">
        <div *ngFor="let field of formTemplate.fields" class="space-y-2">
          <label class="block text-sm font-medium text-gray-700">
            {{ field.label }}
            <span *ngIf="field.required" class="text-red-500 ml-1">*</span>
          </label>

          <div [ngSwitch]="field.type">
            <!-- Text inputs -->
            <input
              *ngSwitchCase="'text'"
              [formControlName]="field.id"
              type="text"
              [placeholder]="field.placeholder"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500"
              [class.border-red-500]="isFieldInvalid(field.id)"
            />

            <input
              *ngSwitchCase="'email'"
              [formControlName]="field.id"
              type="email"
              [placeholder]="field.placeholder"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500"
              [class.border-red-500]="isFieldInvalid(field.id)"
            />

            <input
              *ngSwitchCase="'phone'"
              [formControlName]="field.id"
              type="tel"
              [placeholder]="field.placeholder"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500"
              [class.border-red-500]="isFieldInvalid(field.id)"
            />

            <input
              *ngSwitchCase="'number'"
              [formControlName]="field.id"
              type="number"
              [placeholder]="field.placeholder"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500"
              [class.border-red-500]="isFieldInvalid(field.id)"
            />

            <!-- Textarea -->
            <textarea
              *ngSwitchCase="'textarea'"
              [formControlName]="field.id"
              [placeholder]="field.placeholder"
              rows="4"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500 resize-none"
              [class.border-red-500]="isFieldInvalid(field.id)"
            ></textarea>

            <!-- Select dropdown -->
            <select
              *ngSwitchCase="'select'"
              [formControlName]="field.id"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500"
              [class.border-red-500]="isFieldInvalid(field.id)"
            >
              <option value="">{{ field.placeholder || 'Select an option' }}</option>
              <option *ngFor="let option of field.options" [value]="option">{{ option }}</option>
            </select>

            <!-- Checkboxes -->
            <div *ngSwitchCase="'checkbox'" class="space-y-3">
              <label *ngFor="let option of field.options; let i = index" class="flex items-center space-x-3">
                <input
                  type="checkbox"
                  [value]="option"
                  (change)="onCheckboxChange(field.id, option, $event)"
                  class="rounded border-gray-300 text-blue-600 focus:ring-blue-500"
                />
                <span class="text-sm text-gray-700">{{ option }}</span>
              </label>
            </div>

            <!-- Radio buttons -->
            <div *ngSwitchCase="'radio'" class="space-y-3">
              <label *ngFor="let option of field.options; let i = index" class="flex items-center space-x-3">
                <input
                  [formControlName]="field.id"
                  type="radio"
                  [value]="option"
                  class="border-gray-300 text-blue-600 focus:ring-blue-500"
                />
                <span class="text-sm text-gray-700">{{ option }}</span>
              </label>
            </div>

            <!-- Date -->
            <input
              *ngSwitchCase="'date'"
              [formControlName]="field.id"
              type="date"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500"
              [class.border-red-500]="isFieldInvalid(field.id)"
            />

            <!-- File upload -->
            <input
              *ngSwitchCase="'file'"
              [formControlName]="field.id"
              type="file"
              (change)="onFileChange(field.id, $event)"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500"
              [class.border-red-500]="isFieldInvalid(field.id)"
            />
          </div>

          <!-- Field validation errors -->
          <div *ngIf="isFieldInvalid(field.id)" class="text-red-500 text-sm mt-1">
            <div *ngIf="dynamicForm.get(field.id)?.errors?.['required']">
              {{ field.label }} is required
            </div>
            <div *ngIf="dynamicForm.get(field.id)?.errors?.['email']">
              Please enter a valid email address
            </div>
            <div *ngIf="dynamicForm.get(field.id)?.errors?.['minlength']">
              Minimum length is {{ field.validation?.minLength }} characters
            </div>
            <div *ngIf="dynamicForm.get(field.id)?.errors?.['maxlength']">
              Maximum length is {{ field.validation?.maxLength }} characters
            </div>
            <div *ngIf="dynamicForm.get(field.id)?.errors?.['pattern']">
              Please enter a valid format
            </div>
          </div>
        </div>

        <!-- Submit button -->
        <div class="pt-4">
          <button
            type="submit"
            [disabled]="isSubmitting"
            class="w-full bg-blue-600 text-white py-3 px-4 rounded-md hover:bg-blue-700 focus:ring-4 focus:ring-blue-500 focus:ring-opacity-50 transition-colors disabled:bg-gray-400 disabled:cursor-not-allowed"
          >
            <span *ngIf="!isSubmitting">Submit</span>
            <span *ngIf="isSubmitting" class="flex items-center justify-center">
              <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              Submitting...
            </span>
          </button>
        </div>
      </form>
    </div>
